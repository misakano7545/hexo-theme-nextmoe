# 手动发布到 npm。个人主题默认不发 npm；发布 GitHub Release 不再触发此工作流。
# 只有确认包名归属和 token 权限后，才从 Actions 页面手动运行。

name: Node.js Package

on:
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          registry-url: https://registry.npmjs.org/
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
